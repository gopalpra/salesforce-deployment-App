<template>
    <lightning-card title="🚀 Deployment Tool" icon-name="standard:apex">

        <div class={mainLayoutClass} style="position:relative;">

            <div class={mainContentClass}>

                <!-- Org Banner (shows when userStoryId is available) -->
                <template if:true={showOrgBanner}>
                    <div class={orgBannerClass} style="margin:8px 16px; border-radius:4px; padding:8px 16px;">
                        <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        <strong>{orgBannerMessage}</strong>
                    </div>
                </template>

                <!-- Quick Load Actions Bar -->
                <div class="slds-m-around_medium slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <span class="slds-text-title_caps slds-text-color_weak">Quick Load Actions</span>
                    <lightning-button label="Previously Committed" icon-name="utility:clock"
                        icon-position="left" variant="neutral" onclick={togglePrevCommitPanel}>
                    </lightning-button>
                </div>

                <!-- TAB BAR -->
                <div class="slds-m-horizontal_medium">
                    <div class="slds-tabs_default">
                        <ul class="slds-tabs_default__nav" role="tablist">

                            <li class={findChangesTabClass} title="Deploy" role="presentation">
                                <a class="slds-tabs_default__link" role="tab"
                                   onclick={handleTabSwitch} data-tab="findChanges" tabindex="0">
                                    🚀 Deploy
                                </a>
                            </li>

                            <li class={selectedChangesTabClass} title="Selected Changes" role="presentation">
                                <a class="slds-tabs_default__link" role="tab"
                                   onclick={handleTabSwitch} data-tab="selectedChanges" tabindex="-1">
                                    Selected Changes
                                    <template if:true={hasSelectedComponents}>
                                        <span class="slds-badge slds-m-left_x-small">{selectedComponents.length}</span>
                                    </template>
                                </a>
                            </li>

                        </ul>

                        <!-- ══════════════════════════
                             PANEL 1 — DEPLOY
                             ══════════════════════════ -->
                        <div class={findChangesPanelClass} role="tabpanel">

                            <div class="slds-m-top_medium" style="overflow:visible; position:relative;">

                                <div style="display:flex; flex-wrap:nowrap; gap:8px;
                                            font-size:11px; font-weight:600; color:#706e6b;
                                            text-transform:uppercase; letter-spacing:.4px;
                                            padding-bottom:4px; padding-left:2px;">
                                    <div style="width:220px; flex-shrink:0;">Metadata Type</div>
                                    <div style="width:200px; flex-shrink:0;">Name</div>
                                    <div style="width:180px; flex-shrink:0;">Label</div>
                                    <div style="width:180px; flex-shrink:0;">Created By</div>
                                    <div style="width:180px; flex-shrink:0;">Created Date</div>
                                    <div style="width:180px; flex-shrink:0;">Modified By</div>
                                    <div style="width:180px; flex-shrink:0;">Modified Date</div>
                                </div>

                                <div style="display:flex; flex-wrap:nowrap; align-items:flex-end;
                                            gap:8px; overflow:visible; position:relative;">

                                    <div style="width:220px; flex-shrink:0; overflow:visible; position:relative;">
                                        <lightning-combobox
                                            name="metadataType"
                                            label="Metadata Type"
                                            placeholder="Select Type"
                                            value={selectedType}
                                            options={metadataOptions}
                                            onchange={handleTypeChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div style="width:160px; flex-shrink:0;">
                                        <lightning-input
                                            type="search"
                                            label="Name"
                                            placeholder="e.g. HelloWorld"
                                            value={filterName}
                                            onchange={handleFilterChange}
                                            data-filter="name">
                                        </lightning-input>
                                    </div>

                                    <div style="width:160px; flex-shrink:0;">
                                        <lightning-input
                                            type="search"
                                            label="Label"
                                            placeholder="e.g. My Class"
                                            value={filterLabel}
                                            onchange={handleFilterChange}
                                            data-filter="label">
                                        </lightning-input>
                                    </div>

                                    <div style="width:160px; flex-shrink:0;">
                                        <lightning-input
                                            type="search"
                                            label="Created By"
                                            placeholder="User name"
                                            value={filterCreatedBy}
                                            onchange={handleFilterChange}
                                            data-filter="createdBy">
                                        </lightning-input>
                                    </div>

                                    <div style="width:150px; flex-shrink:0; overflow:visible; position:relative;">
                                        <lightning-input
                                            type="date"
                                            label="Created Date"
                                            value={filterCreatedAfter}
                                            onchange={handleFilterChange}
                                            data-filter="createdAfter">
                                        </lightning-input>
                                    </div>

                                    <div style="width:160px; flex-shrink:0;">
                                        <lightning-input
                                            type="search"
                                            label="Modified By"
                                            placeholder="User name"
                                            value={filterModifiedBy}
                                            onchange={handleFilterChange}
                                            data-filter="modifiedBy">
                                        </lightning-input>
                                    </div>

                                    <div style="width:150px; flex-shrink:0; overflow:visible; position:relative;">
                                        <lightning-input
                                            type="date"
                                            label="Modified Date"
                                            value={filterModifiedAfter}
                                            onchange={handleFilterChange}
                                            data-filter="modifiedAfter">
                                        </lightning-input>
                                    </div>

                                    <div style="flex-shrink:0; display:flex; align-items:flex-end;
                                                gap:4px; padding-bottom:1px;">
                                        <lightning-button
                                            label="Get Changes"
                                            variant="brand"
                                            disabled={isLoading}
                                            onclick={fetchComponents}>
                                        </lightning-button>
                                        <template if:true={hasActiveFilters}>
                                            <lightning-button
                                                label="✕ Clear"
                                                variant="neutral"
                                                title="Clear All Filters"
                                                onclick={clearFilters}>
                                            </lightning-button>
                                        </template>
                                    </div>

                                </div>

                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                    {filterSummaryText}
                                </p>

                            </div>

                            <template if:true={hasComponents}>
                                <div class="slds-m-top_medium slds-box">
                                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                                        <h3 class="slds-text-heading_small">
                                            Results &nbsp;
                                            <span class="slds-badge">{filteredComponents.length} item(s)</span>
                                        </h3>
                                        <div>
                                            <lightning-button-group>
                                                <lightning-button label="Select All (Filtered)"
                                                    variant="neutral" onclick={selectAll}>
                                                </lightning-button>
                                                <lightning-button label="Deselect All"
                                                    variant="neutral" onclick={deselectAll}>
                                                </lightning-button>
                                            </lightning-button-group>
                                        </div>
                                    </div>

                                    <div class="slds-grid slds-text-title_caps slds-text-color_weak
                                                slds-m-bottom_x-small slds-p-bottom_x-small"
                                         style="border-bottom:1px solid #dddbda; font-size:11px;">
                                        <div class="slds-col slds-size_1-of-12"></div>
                                        <div class="slds-col slds-size_2-of-12">Name (API)</div>
                                        <div class="slds-col slds-size_2-of-12">Label</div>
                                        <div class="slds-col slds-size_2-of-12">Created By</div>
                                        <div class="slds-col slds-size_1-of-12">Created Date</div>
                                        <div class="slds-col slds-size_2-of-12">Last Modified By</div>
                                        <div class="slds-col slds-size_1-of-12">Mod. Date</div>
                                        <div class="slds-col slds-size_1-of-12">Status</div>
                                    </div>

                                    <template for:each={filteredComponents} for:item="comp">
                                        <div key={comp.id}
                                             class="slds-grid slds-grid_vertical-align-center slds-m-top_x-small"
                                             style="border-bottom:1px solid #f3f2f2; padding-bottom:4px;">

                                            <div class="slds-col slds-size_1-of-12">
                                                <lightning-input type="checkbox" label=""
                                                    checked={comp.checked}
                                                    data-id={comp.id} data-name={comp.name}
                                                    onchange={handleSelection}>
                                                </lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_2-of-12 slds-truncate"
                                                 title={comp.name} style="font-weight:500; font-size:13px;">
                                                {comp.name}
                                            </div>
                                            <div class="slds-col slds-size_2-of-12 slds-truncate slds-text-color_weak"
                                                 style="font-size:12px;" title={comp.label}>
                                                {comp.label}
                                            </div>
                                            <div class="slds-col slds-size_2-of-12 slds-truncate slds-text-color_weak"
                                                 style="font-size:12px;" title={comp.createdBy}>
                                                {comp.createdByDisplay}
                                            </div>
                                            <div class="slds-col slds-size_1-of-12 slds-text-color_weak"
                                                 style="font-size:12px;">
                                                {comp.createdDate}
                                            </div>
                                            <div class="slds-col slds-size_2-of-12 slds-truncate slds-text-color_weak"
                                                 style="font-size:12px;" title={comp.lastModifiedBy}>
                                                {comp.lastModifiedByDisplay}
                                            </div>
                                            <div class="slds-col slds-size_1-of-12 slds-text-color_weak"
                                                 style="font-size:12px;">
                                                {comp.lastModifiedDate}
                                            </div>
                                            <div class="slds-col slds-size_1-of-12">
                                                <template if:true={comp.checked}>
                                                    <span class="slds-badge"
                                                          style="background:#2e844a;color:#fff;font-size:10px;">
                                                        ✓
                                                    </span>
                                                </template>
                                            </div>

                                        </div>
                                    </template>

                                    <template if:true={noFilteredResults}>
                                        <div style="text-align:center; padding:1.5rem;">
                                            <p class="slds-text-color_weak">No components match your filters.</p>
                                            <lightning-button label="Clear Filters" variant="neutral" onclick={clearFilters}></lightning-button>
                                        </div>
                                    </template>

                                </div>

                                <div class="slds-m-top_small slds-grid slds-grid_align-spread">
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        {selectedComponents.length} component(s) selected total
                                    </p>
                                    <template if:true={hasSelectedComponents}>
                                        <a onclick={goToSelectedTab} class="slds-text-link slds-text-body_small">
                                            View Selected Changes →
                                        </a>
                                    </template>
                                </div>

                            </template>

                        </div><!-- end Deploy panel -->

                        <!-- ══════════════════════════
                             PANEL 2 — SELECTED CHANGES
                             ══════════════════════════ -->
                        <div class={selectedChangesPanelClass} role="tabpanel">

                            <template if:true={hasSelectedComponents}>
                                <div class="slds-grid slds-grid_align-spread slds-m-top_medium slds-m-bottom_small">
                                    <h3 class="slds-text-heading_small">
                                        Changes &nbsp;
                                        <span class="slds-badge">{selectedComponents.length} item(s)</span>
                                    </h3>
                                    <div>
                                        <lightning-button label="Remove Selected"
                                            variant="destructive-text"
                                            disabled={noItemsCheckedInSelected}
                                            onclick={removeCheckedFromSelected}>
                                        </lightning-button>
                                        &nbsp;
                                        <lightning-button label="🚀 Deploy via GitHub"
                                            variant="success" disabled={isLoading}
                                            onclick={deploySelected}>
                                        </lightning-button>
                                    </div>
                                </div>

                                <div class="slds-grid slds-text-title_caps slds-text-color_weak
                                            slds-m-bottom_x-small slds-p-bottom_x-small"
                                     style="border-bottom:1px solid #dddbda; font-size:11px;">
                                    <div class="slds-col slds-size_1-of-12"></div>
                                    <div class="slds-col slds-size_1-of-12">#</div>
                                    <div class="slds-col slds-size_2-of-12">Name</div>
                                    <div class="slds-col slds-size_2-of-12">Label</div>
                                    <div class="slds-col slds-size_2-of-12">Type</div>
                                    <div class="slds-col slds-size_2-of-12">Modified By</div>
                                    <div class="slds-col slds-size_2-of-12">Mod. Date</div>
                                </div>

                                <template for:each={selectedComponents} for:item="comp">
                                    <div key={comp.id} class="slds-grid slds-grid_vertical-align-center slds-m-top_x-small">
                                        <div class="slds-col slds-size_1-of-12">
                                            <lightning-input type="checkbox" label=""
                                                checked={comp.markedForRemoval}
                                                data-id={comp.id} onchange={handleRemovalCheck}>
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-12 slds-text-color_weak slds-text-body_small">{comp.rowNum}</div>
                                        <div class="slds-col slds-size_2-of-12 slds-truncate" title={comp.name}>{comp.name}</div>
                                        <div class="slds-col slds-size_2-of-12 slds-truncate slds-text-color_weak" style="font-size:12px;" title={comp.label}>{comp.label}</div>
                                        <div class="slds-col slds-size_2-of-12 slds-text-color_weak" style="font-size:12px;">{comp.metadataType}</div>
                                        <div class="slds-col slds-size_2-of-12 slds-text-color_weak slds-truncate" style="font-size:12px;">{comp.lastModifiedByDisplay}</div>
                                        <div class="slds-col slds-size_2-of-12 slds-text-color_weak" style="font-size:12px;">{comp.lastModifiedDate}</div>
                                    </div>
                                </template>
                            </template>

                            <template if:false={hasSelectedComponents}>
                                <div style="text-align:center;padding:2rem 0;">
                                    <lightning-icon icon-name="utility:check" size="large"></lightning-icon>
                                    <p class="slds-text-heading_small slds-m-top_small">No components selected yet.</p>
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        Go to <a onclick={goToFindTab} class="slds-text-link">Deploy Tab</a>.
                                    </p>
                                </div>
                            </template>

                        </div><!-- end Selected panel -->

                    </div><!-- end tabs -->
                </div>

            </div><!-- end left column -->

            <!-- RIGHT — Previously Committed -->
            <template if:true={showPrevCommitPanel}>
                <div style="width:380px; flex-shrink:0; border-left:2px solid #dddbda; background:#fafaf9;">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-horizontal_medium slds-p-vertical_small"
                         style="border-bottom:1px solid #dddbda; background:#f3f2f2;">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <lightning-icon icon-name="utility:clock" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <h3 class="slds-text-heading_small">Previously Committed</h3>
                        </div>
                        <lightning-button-icon icon-name="utility:close" variant="bare"
                            alternative-text="Close" onclick={togglePrevCommitPanel}>
                        </lightning-button-icon>
                    </div>

                    <template if:true={isPrevCommitLoading}>
                        <div class="slds-p-around_large" style="text-align:center;">
                            <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                        </div>
                    </template>

                    <template if:true={prevCommitError}>
                        <div class="slds-p-around_medium">
                            <p class="slds-text-color_error slds-text-body_small">❌ {prevCommitError}</p>
                        </div>
                    </template>

                    <template if:true={hasPrevCommits}>
                        <div style="overflow-y:auto; max-height:65vh;">
                            <template for:each={prevCommits} for:item="pr">
                                <div key={pr.number} style="border-bottom:1px solid #e5e5e5;">
                                    <div class="slds-grid slds-grid_vertical-align-center slds-p-horizontal_medium slds-p-vertical_small"
                                         style="cursor:pointer;" data-pr={pr.number} onclick={togglePrExpand}>
                                        <lightning-icon icon-name={pr.expandIcon} size="xx-small" class="slds-m-right_x-small" style="flex-shrink:0;"></lightning-icon>
                                        <div class="slds-col slds-has-flexi-truncate">
                                            <p class="slds-truncate slds-text-body_small" style="font-weight:500;" title={pr.title}>{pr.title}</p>
                                            <p class="slds-text-body_small slds-text-color_weak">PR #{pr.number} · {pr.mergedAt}</p>
                                        </div>
                                        <span class="slds-badge slds-m-left_x-small" style="background:#0070d2;color:#fff;flex-shrink:0;">{pr.fileCount} files</span>
                                    </div>
                                    <template if:true={pr.expanded}>
                                        <div class="slds-p-horizontal_medium slds-p-bottom_small" style="background:#fff;">
                                            <div class="slds-grid slds-text-title_caps slds-text-color_weak slds-p-vertical_x-small"
                                                 style="border-bottom:1px solid #e5e5e5; font-size:11px;">
                                                <div class="slds-col slds-size_7-of-12">Component</div>
                                                <div class="slds-col slds-size_5-of-12">Type</div>
                                            </div>
                                            <template for:each={pr.files} for:item="file">
                                                <div key={file.path} class="slds-grid slds-grid_vertical-align-center slds-p-vertical_xx-small" style="border-bottom:1px solid #f3f2f2;">
                                                    <div class="slds-col slds-size_7-of-12 slds-truncate" title={file.fileLabel} style="font-size:12px;">{file.name}</div>
                                                    <div class="slds-col slds-size_3-of-12" style="font-size:11px;">
                                                        <span class="slds-badge slds-badge_lightest">{file.metadataType}</span>
                                                    </div>
                                                    <div class="slds-col slds-size_2-of-12" style="font-size:10px; color:#706e6b; text-align:right;">
                                                        <template if:true={file.hasMultiple}>
                                                            <span title={file.fileLabel}>📎 {file.fileCount}</span>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template if:false={hasPrevCommits}>
                        <template if:false={isPrevCommitLoading}>
                            <template if:false={prevCommitError}>
                                <div style="text-align:center;padding:2rem;">
                                    <p class="slds-text-body_small slds-text-color_weak">No previous commits found.</p>
                                </div>
                            </template>
                        </template>
                    </template>
                </div>
            </template>

        </div>

        <!-- Progress Bar -->
        <template if:true={showProgress}>
            <div class="slds-m-around_medium">
                <lightning-progress-bar value={progressValue} size="large"></lightning-progress-bar>
                <p class="slds-text-body_small slds-m-top_small">{progressLabel}</p>
            </div>
        </template>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-m-around_medium">
                <lightning-spinner alternative-text="Processing..." size="small"></lightning-spinner>
            </div>
        </template>

        <!-- Status Message -->
        <template if:true={statusMessage}>
            <div class="slds-m-around_medium">
                <p class={statusClass}><strong>{statusMessage}</strong></p>
            </div>
        </template>

        <!-- ══════════════════════════════════════════════════════
             ✅ COMMIT MODAL — Opens when the Deploy button is clicked
             ══════════════════════════════════════════════════════ -->
        <template if:true={showCommitModal}>
            <section role="dialog" tabindex="-1" aria-modal="true"
                     class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    <!-- Modal Header -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={handleModalCancel}>
                            <lightning-icon icon-name="utility:close"
                                            alternative-text="Close"
                                            size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate">
                            🚀 Commit to GitHub
                        </h2>
                    </header>

                    <!-- Modal Body -->
                    <div class="slds-modal__content slds-p-around_medium">

                        <!-- Spinner: Until the existing branch is fetched-->
                        <template if:true={isModalLoading}>
                            <div class="slds-align_absolute-center slds-p-around_large"
                                 style="min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                                <lightning-spinner alternative-text="Loading..."
                                                   size="medium"></lightning-spinner>
                                <p class="slds-m-top_small slds-text-color_weak slds-text-body_small">
                                    Checking existing branch...
                                </p>
                            </div>
                        </template>

                        <!-- Body content:After the loading is complete -->
                        <template if:false={isModalLoading}>

                            <!-- Components count summary -->
                            <div class="slds-box slds-theme_shade slds-m-bottom_medium"
                                 style="border-radius:4px;">
                                <p class="slds-text-body_regular">
                                    <lightning-icon icon-name="utility:package"
                                                    size="x-small"
                                                    class="slds-m-right_x-small"></lightning-icon>
                                    <strong>{selectedComponents.length}</strong> component(s) ready to commit
                                </p>
                            </div>

                            <!-- Existing Branch info row -->
                            <div class="slds-m-bottom_medium"
                                 style="padding:8px 12px; background:#f3f2f2; border-radius:4px; border-left:3px solid #0070d2;">
                                <p class="slds-text-body_small" style="color:#3e3e3c;">
                                    <lightning-icon icon-name="utility:branch_merge"
                                                    size="x-small"
                                                    class="slds-m-right_xx-small"></lightning-icon>
                                    {existingBranchInfo}
                                </p>
                            </div>

                            <!-- Toggle — Show only when an existing branch is available-->
                            <template if:true={hasExistingBranch}>
                                <div class="slds-m-bottom_medium">
                                    <lightning-input
                                        type="toggle"
                                        label="Create a new branch?"
                                        message-toggle-active="Yes — delete existing branch &amp; close open PRs"
                                        message-toggle-inactive="No — commit to existing branch"
                                        checked={createNewBranch}
                                        onchange={handleNewBranchToggle}>
                                    </lightning-input>
                                </div>

                                <!-- ⚠️ Warning box: Only when the toggle is ON -->
                                <template if:true={showNewBranchWarning}>
                                    <div style="background:#fff3cd; border:1px solid #f0ad4e;
                                                border-radius:4px; padding:10px 14px;
                                                margin-bottom:12px; display:flex; align-items:flex-start; gap:8px;">
                                        <lightning-icon icon-name="utility:warning"
                                                        size="x-small"
                                                        style="color:#c23934; flex-shrink:0; margin-top:2px;">
                                        </lightning-icon>
                                        <div>
                                            <p class="slds-text-body_small" style="font-weight:600; color:#c23934;">
                                                Warning: This action cannot be undone!
                                            </p>
                                            <p class="slds-text-body_small slds-m-top_xx-small" style="color:#3e3e3c;">
                                                Branch <strong>{existingBranchName}</strong> will be
                                                permanently deleted and all its open Pull Requests
                                                will be closed.
                                            </p>
                                        </div>
                                    </div>
                                </template>
                            </template>

                            <!-- Pehli baar: no existing branch info -->
                            <template if:false={hasExistingBranch}>
                                <div style="background:#eaf5ea; border:1px solid #2e844a;
                                            border-radius:4px; padding:10px 14px; margin-bottom:12px;
                                            display:flex; align-items:center; gap:8px;">
                                    <lightning-icon icon-name="utility:info"
                                                    size="x-small"
                                                    style="color:#2e844a; flex-shrink:0;">
                                    </lightning-icon>
                                    <p class="slds-text-body_small" style="color:#2e844a;">
                                        No existing branch found. A new feature branch will be
                                        automatically created for this User Story.
                                    </p>
                                </div>
                            </template>

                        </template>
                    </div>

                    <!-- Modal Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            disabled={isModalLoading}
                            onclick={handleModalCancel}>
                        </lightning-button>

                        <template if:true={createNewBranch}>
                            <lightning-button
                                label="🔄 Delete Old Branch &amp; Commit"
                                variant="destructive"
                                disabled={isModalConfirmDisabled}
                                onclick={handleModalConfirm}>
                            </lightning-button>
                        </template>

                        <template if:false={createNewBranch}>
                            <lightning-button
                                label="✅ Confirm &amp; Commit"
                                variant="brand"
                                disabled={isModalConfirmDisabled}
                                onclick={handleModalConfirm}>
                            </lightning-button>
                        </template>
                    </footer>

                </div>
            </section>

            <!-- Modal backdrop -->
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!-- ══ END COMMIT MODAL ══ -->

    </lightning-card>
</template>
